name: eval

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag holding eval.zip"
        required: false
        default: "eval"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg + faster-whisper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip
          python -m pip install --quiet faster-whisper
      - name: Download eval bundle
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          mkdir -p eval
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${TAG}/eval.zip" -o eval.zip
          unzip -oq eval.zip -d .
          ls -la eval | head
      - name: Run eval
        run: python eval.py eval
